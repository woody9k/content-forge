<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Content Forge{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9998;</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Content&nbsp;Forge</a>
  <nav>
    <a href="/">Topics</a>
    <a href="/auth">Auth</a>
    <a href="/health" target="_blank" rel="noopener">Health</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>model: <code>{{ model }}</code></span>
  <span>storage: <code>{{ content_root }}</code></span>
</footer>
</body>
</html>
