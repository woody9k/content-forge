<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Content Forge{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9998;</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Content&nbsp;Forge</a>
  <nav>
  {% if current_user %}
    <a href="/">Topics</a>
    <a href="/voices">Voices</a>
    {% if current_user.is_admin %}<a href="/clients">Connectors</a><a href="/auth">Auth</a>{% endif %}
    <a href="/account">{{ current_user.display_name }}</a>
    <form method="post" action="/logout" class="navform">
      <button class="linkbtn" type="submit">Sign out</button>
    </form>
  {% elif require_auth %}
    <a href="/login">Sign in</a>
  {% else %}
    <a href="/">Topics</a>
    <a href="/voices">Voices</a>
    <a href="/auth">Auth</a>
    <a href="/health" target="_blank" rel="noopener">Health</a>
  {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>model: <code>{{ model }}</code></span>
  <span>storage: <code>{{ content_root }}</code></span>
</footer>
</body>
</html>
