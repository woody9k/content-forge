# Content Forge on contentcreator.socialupkeep.com — the public-facing box
# (separate from the boblab.net/internal-CA deployment in
# nginx-contentforge.conf). Cert is Let's Encrypt via certbot's nginx plugin
# (HTTP-01, since port 80 is actually reachable from the internet here):
#
#     sudo certbot --nginx -d contentcreator.socialupkeep.com \
#         --non-interactive --agree-tos -m <you>@<domain>
#
# certbot rewrites the paths below and adds its own renewal + the :80
# redirect server block on first run; what's checked in is the pre-certbot
# skeleton so `nginx -t` passes before you've issued anything.
#
# Every request here needs `Authorization: Bearer <CF_ACCESS_TOKEN>` (or HTTP
# Basic with the token as the password) — see app/config.py. Unlike the LAN
# deployment, this box is reachable from the open internet.

upstream content_forge {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen                   80;
    listen                   [::]:80;
    server_name              contentcreator.socialupkeep.com;

    # certbot's HTTP-01 challenge needs plain :80 to answer; everything else
    # gets bounced to HTTPS once a cert exists (certbot adds the redirect).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen                   443 ssl http2;
    listen                   [::]:443 ssl http2;
    server_name              contentcreator.socialupkeep.com;

    # Placeholder paths — `certbot --nginx` overwrites these with the real
    # /etc/letsencrypt/live/... cert on first issuance.
    ssl_certificate          /etc/letsencrypt/live/contentcreator.socialupkeep.com/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/contentcreator.socialupkeep.com/privkey.pem;

    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache        shared:CF:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Voice samples (.docx/.md) are uploaded through the UI.
    client_max_body_size 50m;

    access_log /var/log/nginx/contentcreator.access.log;
    error_log  /var/log/nginx/contentcreator.error.log;

    # ---- MCP (streamable HTTP + SSE) -------------------------------------
    # Buffering MUST stay off or SSE frames are held back until the response
    # completes, which for a generation call is minutes.  The read timeout is
    # set above CF_CLAUDE_TIMEOUT (900s) so a slow article does not get cut.
    location /mcp {
        proxy_pass              http://content_forge;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        chunked_transfer_encoding on;

        proxy_connect_timeout   30s;
        proxy_send_timeout      1200s;
        proxy_read_timeout      1200s;
    }

    # ---- Web UI ----------------------------------------------------------
    location / {
        proxy_pass              http://content_forge;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        # Generation is driven from the UI too — same long-poll reality.
        proxy_buffering         off;
        proxy_connect_timeout   30s;
        proxy_send_timeout      1200s;
        proxy_read_timeout      1200s;
    }
}
