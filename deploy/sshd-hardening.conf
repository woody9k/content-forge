# Content Forge box — internet-facing, key-only, single admin user.

# Nothing needs to log in as root. Key-based root login was still permitted
# ("without-password"); no root key exists today, so this closes a door rather
# than shutting one that was in use.
PermitRootLogin no

# Passwords are already off; stated explicitly so a future edit to the main
# config cannot quietly re-enable them.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Headless server: no display to forward, and no reason to let an
# authenticated session tunnel arbitrary traffic through this host.
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no

# Tighter than the defaults (6 / 120s). With key-only auth a legitimate client
# succeeds on its first or second offered key.
MaxAuthTries 3
LoginGraceTime 30
