# Content Forge on write.socialupkeep.com — the public-facing box
# (separate from the boblab.net/internal-CA deployment in
# nginx-contentforge.conf). Cert is Let's Encrypt via certbot's nginx plugin
# (HTTP-01, since port 80 is actually reachable from the internet here):
#
#     sudo certbot --nginx -d write.socialupkeep.com \
#         --non-interactive --agree-tos -m <you>@<domain>
#
# certbot rewrites the paths below and adds its own renewal + the :80
# redirect server block on first run; what's checked in is the pre-certbot
# skeleton so `nginx -t` passes before you've issued anything.
#
# Authentication is per-user and lives in the app, not here: a session cookie
# for the browser, a personal access token for scripts, or an OAuth token for
# an MCP connector — see app/main.py. Unlike the LAN deployment, this box is
# reachable from the open internet.
#
# Note nginx must not gate these itself. The OAuth endpoints (/authorize,
# /token, /register, /revoke and /.well-known/*) are reached by a connector
# that has no credential yet, which is the entire point of them.

# --- rate limiting ---------------------------------------------------------
# Keyed on the real client address. Two zones, because the traffic shapes are
# nothing alike: a person signing in makes a handful of requests, while an
# agent driving MCP can legitimately make a great many.
#
# Deliberately NOT applied to the whole site: the browser polls
# /jobs/<id>/status roughly once a second while an article generates, and a
# limit tight enough to be worth having on the auth endpoints would break it.
limit_req_zone $binary_remote_addr zone=cf_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=cf_mcp:10m  rate=300r/m;
limit_req_status 429;

upstream content_forge {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen                   80;
    listen                   [::]:80;
    server_name              write.socialupkeep.com;

    # certbot's HTTP-01 challenge needs plain :80 to answer; everything else
    # gets bounced to HTTPS once a cert exists (certbot adds the redirect).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen                   443 ssl http2;
    listen                   [::]:443 ssl http2;
    server_name              write.socialupkeep.com;

    # Placeholder paths — `certbot --nginx` overwrites these with the real
    # /etc/letsencrypt/live/... cert on first issuance.
    ssl_certificate          /etc/letsencrypt/live/write.socialupkeep.com/fullchain.pem;
    ssl_certificate_key      /etc/letsencrypt/live/write.socialupkeep.com/privkey.pem;

    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache        shared:CF:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' is required by the templates' inline styles and the one
    # inline confirm() handler; everything else is same-origin. frame-ancestors
    # blocks clickjacking of the OAuth consent screen — the page where being
    # framed would actually matter.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Voice samples (.docx/.md) are uploaded through the UI.
    client_max_body_size 50m;

    access_log /var/log/nginx/write.access.log;
    error_log  /var/log/nginx/write.error.log;

    # ---- MCP (streamable HTTP + SSE) -------------------------------------
    # Buffering MUST stay off or SSE frames are held back until the response
    # completes, which for a generation call is minutes.  The read timeout is
    # set above CF_CLAUDE_TIMEOUT (900s) so a slow article does not get cut.
    location /mcp {
        # Generous: an agent legitimately bursts. This is a runaway/abuse
        # ceiling, not a throttle on normal use.
        limit_req               zone=cf_mcp burst=60 nodelay;

        proxy_pass              http://content_forge;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        chunked_transfer_encoding on;

        proxy_connect_timeout   30s;
        proxy_send_timeout      1200s;
        proxy_read_timeout      1200s;
    }

    # ---- sign-in and OAuth credential endpoints ---------------------------
    # Where guessing and token-grinding happen, and no legitimate client hits
    # them in a loop. A regex location outranks the prefix match below.
    location ~ ^/(login|token|authorize|register|revoke)$ {
        limit_req               zone=cf_auth burst=10 nodelay;

        proxy_pass              http://content_forge;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_buffering         off;
    }

    # ---- Web UI ----------------------------------------------------------
    location / {
        proxy_pass              http://content_forge;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        # Generation is driven from the UI too — same long-poll reality.
        proxy_buffering         off;
        proxy_connect_timeout   30s;
        proxy_send_timeout      1200s;
        proxy_read_timeout      1200s;
    }
}
